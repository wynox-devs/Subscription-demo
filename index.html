<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wynox Subscription</title>
  <link rel="icon" href="Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <noscript>
    <style>
      .reveal {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="hero reveal">
    <img class="logo" src="Logo.png" alt="Wynox" />

    <!-- CURRENCY SELECTOR -->
    <div class="currency-selector-container" id="currency-selector-container">
      <button class="currency-trigger" id="currency-trigger" aria-label="Select currency" aria-expanded="false">
        <span class="currency-flag" id="currency-flag-display">🇺🇸</span>
        <span class="currency-code" id="currency-code-display">USD</span>
        <span class="currency-symbol" id="currency-symbol-display">$</span>
        <svg class="currency-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      
      <!-- No inline style! -->
      <div class="currency-dropdown" id="currency-dropdown">
        <div class="currency-search-container">
          <input 
            type="text" 
            class="currency-search" 
            id="currency-search" 
            placeholder="Search currency..."
            aria-label="Search currency"
          />
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        
        <div class="currency-list" id="currency-list">
          <!-- Currency options will be dynamically inserted here -->
        </div>
      </div>
    </div>

    <form class="signup" onsubmit="return false;">
      <label class="field">
        <span class="prefix" aria-hidden="true">@</span>
        <input type="text" name="username" placeholder="username" autocomplete="username" aria-label="Username" />
      </label>
      <label class="field">
        <input type="email" name="email" placeholder="example@email.com" autocomplete="email" aria-label="Email" />
      </label>
    </form>
  </header>

  <main class="plans">
    <!-- FREE -->
    <article class="card reveal">
      <h2>Free</h2>
      <div class="spacer"></div>
      <div class="price" data-plan="free">
        <span class="amount">$0</span>
      </div>
      <div class="actions">
        <button type="button" class="btn outline">details</button>
        <button type="button" class="btn filled">Free</button>
      </div>
    </article>

    <!-- STUDENT -->
    <article class="card reveal">
      <h2>Student</h2>
      <div class="spacer"></div>
      <div class="price" data-plan="student">
        <span class="amount">$1/</span>
        <span class="period">month</span>
      </div>
      <div class="actions">
        <button type="button" class="btn outline">details</button>
        <button type="button" class="btn filled">Subscribe</button>
      </div>
    </article>

    <!-- PRO -->
    <article class="card featured reveal">
      <span class="badge">Best</span>
      <h2>Pro</h2>
      <div class="spacer"></div>
      <div class="price" data-plan="pro">
        <span class="amount">$19/</span>
        <span class="period">month</span>
      </div>
      <div class="actions">
        <button type="button" class="btn outline">details</button>
        <button type="button" class="btn outline">Try for free(7 days)</button>
        <button type="button" class="btn filled">Subscribe</button>
      </div>
    </article>

    <!-- FAMILY -->
    <article class="card reveal">
      <h2>Family</h2>
      <div class="spacer"></div>
      <div class="price" data-plan="family">
        <span class="amount">$25/</span>
        <span class="period">month</span>
      </div>
      <div class="actions">
        <button type="button" class="btn outline">details</button>
        <button type="button" class="btn outline">Try for free(3 days)</button>
        <button type="button" class="btn filled">Subscribe</button>
      </div>
    </article>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="alert" aria-live="polite">
    <span class="toast-icon">✓</span>
    <span class="toast-message" id="toast-message">Currency updated</span>
    <button class="toast-close" id="toast-close" aria-label="Close notification">×</button>
  </div>

  <!-- SCRIPTS -->
  <script src="pricing-updater.js"></script>
  <script>
    // Scroll reveal
    (function () {
      const elements = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) {
        elements.forEach(el => el.classList.add("visible"));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -60px 0px" });
      elements.forEach(el => observer.observe(el));
    })();

    // Toast handler
    (function() {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastClose = document.getElementById('toast-close');
      function showToast(message) {
        if (!toast || !toastMessage) return;
        toastMessage.textContent = message;
        toast.classList.add('show');
        setTimeout(hideToast, 3000);
      }
      function hideToast() { if (toast) toast.classList.remove('show'); }
      if (toastClose) toastClose.addEventListener('click', hideToast);
      window.addEventListener('currencyChange', (e) => {
        if (e.detail && e.detail.currency) showToast(`Currency changed to ${e.detail.currency}`);
      });
      window.showToast = showToast;
      window.hideToast = hideToast;
    })();
  </script>
</body>
</html>
