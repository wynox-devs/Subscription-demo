<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Plans</title>
    <!-- CSS CONNECTED HERE -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- HEADER WITH CURRENCY SELECTOR ONLY -->
    <header>
        <div class="logo">
            <img src="Logo.png" alt="Logo" />
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="currency-selector">
            <label for="currencySelect">Currency:</label>
            <select id="currencySelect">
                <option value="usd">USD ($)</option>
                <option value="eur">EUR (€)</option>
                <option value="gbp">GBP (£)</option>
            </select>
        </div>
        <!-- REGION SELECTOR REMOVED -->
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="pricing-section">
            <h1>Choose Your Plan</h1>
            <div class="pricing-grid">
                <!-- Plan 1 -->
                <div class="pricing-card">
                    <h2>Basic</h2>
                    <p class="price" data-base="9.99">$9.99</p>
                    <ul>
                        <li>Feature 1</li>
                        <li>Feature 2</li>
                        <li>Feature 3</li>
                    </ul>
                    <button>Subscribe</button>
                </div>
                <!-- Plan 2 -->
                <div class="pricing-card popular">
                    <h2>Pro</h2>
                    <p class="price" data-base="19.99">$19.99</p>
                    <ul>
                        <li>Feature 1</li>
                        <li>Feature 2</li>
                        <li>Feature 3</li>
                        <li>Feature 4</li>
                    </ul>
                    <button>Subscribe</button>
                </div>
                <!-- Plan 3 -->
                <div class="pricing-card">
                    <h2>Enterprise</h2>
                    <p class="price" data-base="49.99">$49.99</p>
                    <ul>
                        <li>Feature 1</li>
                        <li>Feature 2</li>
                        <li>Feature 3</li>
                        <li>Feature 4</li>
                        <li>Feature 5</li>
                    </ul>
                    <button>Subscribe</button>
                </div>
            </div>
        </section>
    </main>

    <!-- SCRIPTS -->
    <script src="pricing-updater.js"></script>
</body>
</html>
